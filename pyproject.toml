[project]
name = "customer-churn-analytics"
version = "0.1.0"
description = "Enterprise-quality customer churn analytics portfolio project"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "plotly>=5.22",
    "matplotlib>=3.9",
    "jupyter>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "ipykernel>=6.29",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_churn_analytics"]
